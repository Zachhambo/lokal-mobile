name: Android Cast handoff
on:
  pull_request:
    paths:
      - 'android/app/src/main/kotlin/com/mossapps/flick/Cast*.kt'
      - 'android/app/src/main/kotlin/com/mossapps/flick/MainActivity.kt'
      - 'android/app/src/main/kotlin/com/mossapps/flick/PlaybackStagingGate.kt'
      - 'android/app/src/test/kotlin/com/mossapps/flick/PlaybackStagingGateTest.kt'
      - 'android/app/src/test/kotlin/com/mossapps/flick/Cast*.kt'
      - 'lib/services/casting/**'
      - 'lib/features/player/widgets/playback_output_picker.dart'
      - 'lib/features/player/screens/full_player_screen.dart'
      - 'lib/providers/cast_provider.dart'
      - 'lib/services/player_service.dart'
      - 'lib/services/notification_service.dart'
      - 'android/app/src/main/kotlin/com/mossapps/flick/MusicNotificationService.kt'
      - 'android/app/src/main/AndroidManifest.xml'
      - 'android/app/src/test/kotlin/com/mossapps/flick/MusicMediaSessionTest.kt'
      - 'test/services/remote_notification_duration_test.dart'
      - 'lib/services/player_volume_control.dart'
      - 'lib/features/player/widgets/full_player_header.dart'
      - 'lib/features/player/widgets/full_player_library_action.dart'
      - 'lib/features/player/screens/classic_full_player_screen.dart'
      - 'test/features/player/full_player_header_test.dart'
      - 'test/features/player/full_player_library_action_test.dart'
      - 'test/services/player_volume_control_test.dart'
      - 'test/services/casting/**'
      - 'test/features/player/playback_output_picker_test.dart'
      - '.github/workflows/android-cast.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cast:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/android-toolchain
      - name: Generate brand resources for Android host tests
        run: |
          python3 -m pip install --disable-pip-version-check Pillow
          python3 tool/gen_lokal_launcher_icons.py
      - name: Analyze casting and player integration
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings lib/services/casting lib/services/player_service.dart lib/features/settings/screens/casting_settings_screen.dart
      - name: Verify confirmed handoff, SAF staging and receiver HTTP requests
        run: flutter test --no-pub test/services/remote_notification_duration_test.dart test/services/casting test/features/player/playback_output_picker_test.dart test/features/player/full_player_header_test.dart test/features/player/full_player_library_action_test.dart test/services/player_volume_control_test.dart
      - name: Compile Android sender and verify native acknowledgement lifecycle
        run: bash android/gradlew -p android :app:testFullDebugUnitTest --tests com.mossapps.flick.CastVolumeKeysTest --tests com.mossapps.flick.CastPendingReplyTest --tests com.mossapps.flick.CastStagingProtectionTest --tests com.mossapps.flick.MusicMediaSessionTest --tests com.mossapps.flick.PlaybackStagingGateTest --console=plain --no-daemon
      - name: Preserve native Cast test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-cast-tests
          path: build/app/reports/tests/testFullDebugUnitTest
          if-no-files-found: ignore

