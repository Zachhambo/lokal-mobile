name: Recap redesign checks
on:
  pull_request:
    paths:
      - 'lib/features/recap/**'
      - 'lib/data/repositories/recently_played_repository.dart'
      - 'test/features/recap/**'
      - '.github/workflows/recap-redesign.yml'
permissions:
  contents: read
jobs:
  recap:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/android-toolchain
      - name: Analyze recap
        run: flutter analyze --no-fatal-infos lib/features/recap/screens/listening_recap_screen.dart lib/features/recap/widgets/recap_dashboard.dart lib/features/recap/recap_mix.dart test/features/recap/
      - name: Test recap, worker and export
        run: |
          mkdir -p /tmp/opencode
          flutter test --no-pub --dart-define=REPLAY_SCREENSHOTS=true test/features/recap/ test/data/repositories/you_recap_worker_test.dart
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recap-previews
          path: /tmp/opencode/*.png
      - name: Compile Android
        run: flutter build apk --debug --flavor full --target-platform android-arm64 --no-pub
